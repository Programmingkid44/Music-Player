<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">Music player</h1>
    <button id="theme-toggle" class="btn btn-ghost" type="button" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-label">Dark mode</span>
    </button>
  </header>

  <main class="layout">

    <!-- ---------- Library ---------- -->
    <section class="panel library" aria-labelledby="library-heading">
      <div class="panel-head">
        <h2 id="library-heading" class="panel-title">Library</h2>
        <p class="panel-meta" id="library-count">10 songs</p>
      </div>

      <div class="field">
        <label for="genre-filter">Genre</label>
        <select id="genre-filter"></select>
      </div>

      <ul class="songs-container" id="songs-container" aria-label="Songs"></ul>
    </section>

    <!-- ---------- Player ---------- -->
    <section class="panel player" aria-labelledby="now-playing-name">
      <div class="artwork" id="artwork" data-empty="true">
        <img class="artwork-img" id="artwork-img" src="" alt="" hidden>
        <span class="artwork-glyph" id="artwork-glyph" aria-hidden="true">♪</span>
      </div>

      <div class="now-playing">
        <h2 class="song-name" id="now-playing-name">Nothing playing</h2>
        <p class="song-artist" id="now-playing-artist">Pick a song from the library to start</p>
        <p class="song-genre" id="now-playing-genre" hidden></p>
      </div>

      <audio class="player-audio" id="player-audio" controls preload="metadata"></audio>
      <p class="player-status" id="player-status" role="status"></p>

      <div class="transport">
        <button class="btn" id="prev-btn" type="button" disabled>Previous</button>
        <button class="btn btn-primary" id="add-to-playlist-btn" type="button" disabled>Add to playlist</button>
        <button class="btn" id="next-btn" type="button" disabled>Next</button>
      </div>
    </section>

    <!-- ---------- Playlists ---------- -->
    <section class="panel playlists" aria-labelledby="playlists-heading">
      <div class="panel-head">
        <h2 id="playlists-heading" class="panel-title">Playlists</h2>
      </div>

      <form class="create-playlist" id="create-playlist-form">
        <label class="sr-only" for="playlist-name">Playlist name</label>
        <input type="text" id="playlist-name" placeholder="New playlist name" autocomplete="off" maxlength="40">
        <button class="btn btn-primary" type="submit">Create</button>
      </form>

      <ul class="all-playlist-container" id="all-playlist-container" aria-label="All playlists"></ul>

      <div class="current-playlist">
        <h3 class="panel-subtitle" id="current-playlist-title">No playlist selected</h3>
        <ul class="current-playlist-container" id="current-playlist-container" aria-labelledby="current-playlist-title"></ul>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
