<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Music Player</title>
</head>
<body>
    <header>
        <h1>Music player</h1>
        <div class="toggledark">
            <button id="theme-toggle">🌙 Dark Mode</button>
        </div>
    </header>
    <main>
        <div class="song-list section">
            <div class="filter-list">Filter:
                <select id="genre-filter">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="songs-container"></div>
        </div>
        <div class="player section">
            <div class="playing-song">
                <div class="song-image">
                    <img class="song-img" src="" alt="">
                </div>
                <div class="song-details">
                    <h2 class="song-name">Select a song</h2>
                    <p class="song-artist">Choose a track from the list</p>
                </div>
            </div>
            <div class="song-control">
                <audio class="player-audio" controls preload="metadata"></audio>
            </div>
            <div class="next-previous">
                <button class="Previous">Previous</button>
                <button class="Next">Next</button>
            </div>
            <button class="add-to-playlist">Add to Playlist</button>
        </div>
        <div class="playlists section">
            <div class="create-playlist">
                <input type="text" id="playlist-name" placeholder="Enter playlist name">
                <button id="create-playlist-btn">Create Playlist</button>
            </div>
            <div class="current-playlist">
                <h3>Current playlist</h3>
                <div class="current-playlist-container">
                    
                </div>
            </div>
            <div class="all-playlist">
                <h3>All playlists</h3>
                <div class="all-playlist-container">

                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
